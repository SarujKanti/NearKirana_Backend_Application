# ---------------------------------------------------------------
# DEMO PROFILE (hosted testing on Render, SPRING_PROFILES_ACTIVE=demo)
#
# Like "dev", OTPs are NOT sent by SMS (no SMS provider yet):
#   - demo numbers below always get the fixed OTP
#   - any other number gets a random OTP, printed ONLY in the Render logs
# Unlike "dev", there are NO fallback secrets: OTP_HASH_SECRET, JWT_SECRET,
# DB_URL, DB_USERNAME and DB_PASSWORD must be set as environment variables.
#
# Turn this profile OFF (and add a real SmsSender) before real customers use the app.
# ---------------------------------------------------------------
nearkirana.dev-otp.fixed-otp=123456
nearkirana.dev-otp.demo-numbers=9911111111,9191919191

# Render puts a proxy in front of the app. This makes getRemoteAddr() return the
# real client IP (from X-Forwarded-For) so the per-IP OTP limit works per user.
server.forward-headers-strategy=native

# Free databases allow only a few connections; 5 is plenty for testing.
spring.datasource.hikari.maximum-pool-size=5
