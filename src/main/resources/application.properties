spring.application.name=near-kirana-backend

# ---------------------------------------------------------------
# Database connection (PostgreSQL)
# Format: ${ENV_VARIABLE:default value}
# The password has NO default on purpose: it must come from the
# DB_PASSWORD environment variable and never be written in code.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nearkirana}
spring.datasource.username=${DB_USERNAME:nearkirana_app}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=validate -> Flyway creates the tables; Hibernate only CHECKS
#                  at startup that our @Entity classes match them.
# open-in-view=false -> recommended professional setting (no lazy DB
#                  access while the JSON response is being written).
# ---------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# OTP login rules (see OtpProperties.java)
# The hash secret has NO default here: production must set OTP_HASH_SECRET.
# ---------------------------------------------------------------
nearkirana.otp.expiry=5m
nearkirana.otp.max-attempts=5
nearkirana.otp.resend-cooldown=60s
nearkirana.otp.max-sends-per-hour=5
nearkirana.otp.max-sends-per-ip-per-hour=20
nearkirana.otp.hash-secret=${OTP_HASH_SECRET}

# ---------------------------------------------------------------
# JWT tokens (see JwtProperties.java)
# The signing secret has NO default here: production must set JWT_SECRET
# (at least 32 random characters). Anyone with it could forge tokens.
# ---------------------------------------------------------------
nearkirana.jwt.issuer=nearkirana
nearkirana.jwt.access-token-ttl=15m
nearkirana.jwt.refresh-token-ttl=30d
nearkirana.jwt.secret=${JWT_SECRET}
