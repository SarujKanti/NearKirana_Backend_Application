# ---------------------------------------------------------------
# DEV PROFILE ONLY (active when SPRING_PROFILES_ACTIVE=dev)
# Values here override application.properties on your laptop.
# NEVER activate the "dev" profile on a production server.
# ---------------------------------------------------------------

# A local-only fallback secret so you do not need another environment
# variable on your laptop. Production has no fallback.
nearkirana.otp.hash-secret=${OTP_HASH_SECRET:dev-only-otp-secret-do-not-use-in-production}
nearkirana.jwt.secret=${JWT_SECRET:dev-only-jwt-signing-secret-do-not-use-in-production}

# Demo numbers that always receive this fixed OTP (DevFixedOtpGenerator).
# Customer demo: 9911111111   Shopkeeper (owner) demo: 9191919191
# Any other number still gets a random OTP, shown in the console.
nearkirana.dev-otp.fixed-otp=123456
nearkirana.dev-otp.demo-numbers=9911111111,9191919191
